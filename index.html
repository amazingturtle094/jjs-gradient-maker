<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gradient Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, rgb(255, 255, 255) 0%, rgb(220, 220, 220) 60%, rgb(160, 160, 160) 100%);
      --text-color: #000000;
      --container-bg: rgba(255, 255, 255, 0.6);
      --border-color: #000000;
      --row-bg: #ffffff;
      --btn-bg: #cccccc;
      --btn-active: #999999;
      --input-bg: #ffffff;
      --scrollbar-track: #e0e0e0;
      --scrollbar-thumb: #888888;
      --toggle-bg: #cccccc;
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    body.dark-mode {
      --bg-gradient: radial-gradient(circle at center, #3a3a40 0%, #1c1c20 60%, #000000 100%);
      --text-color: #ffffff;
      --container-bg: rgba(0, 0, 0, 0.6);
      --border-color: #ffffff;
      --row-bg: #222222;
      --btn-bg: #444444;
      --btn-active: #666666;
      --input-bg: #1a1a1a;
      --scrollbar-track: #333333;
      --scrollbar-thumb: #666666;
      --toggle-bg: #444444;
      --shadow-color: rgba(0, 0, 0, 0.7);
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      font-family: 'Finger Paint', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.1vw;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2vh;
      position: relative;
      width: 90vw;
      max-width: 650px;
      height: 92vh;
      justify-content: center;
    }

    .watermark, h1 {
      font-family: 'Finger Paint', Arial, sans-serif;
      text-align: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .watermark {
      font-size: 0.9rem;
      margin: 0;
      opacity: 0.5;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0;
      filter: drop-shadow(0 6px 4px var(--shadow-color));
    }
    
    /* Top controls container for buttons (stacked vertically) */
    .top-controls {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Toggle buttons style */
    .pixel-btn {
      font-family: 'Finger Paint', Arial, sans-serif;
      font-size: 0.9rem;
      padding: 0.6vh 1.2vw;
      cursor: pointer;
      border: 3px solid var(--border-color);
      background: var(--toggle-bg);
      color: var(--text-color);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
      text-align: center;
      filter: drop-shadow(0 5px 4px var(--shadow-color));
    }

    .pixel-btn:active {
      background: var(--btn-active);
    }

    /* Layer system styles with responsive sizing */
    .layers-container {
      display: flex;
      flex-direction: column;
      gap: 1vh;
      width: 100%;
      height: 32vh;
      max-height: 280px;
      background: var(--container-bg);
      border: 3px solid var(--border-color);
      padding: 1.2vh 1.2vw;
      box-sizing: border-box;
      transition: background 0.3s, border-color 0.3s;
      filter: drop-shadow(0 6px 5px var(--shadow-color));
    }

    #layersList {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      box-sizing: border-box;
      position: relative;
    }

    /* Custom pixel-art style scrollbar */
    #layersList::-webkit-scrollbar {
      width: 8px;
    }

    #layersList::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border: 2px solid var(--border-color);
    }

    #layersList::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border: 2px solid var(--border-color);
    }

    .layer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--row-bg);
      border: 2px solid var(--border-color);
      padding: 6px;
      user-select: none;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
      filter: drop-shadow(0 4px 3px var(--shadow-color));
    }

    /* Move buttons layout matching color square height (32px total) */
    .move-buttons {
      display: flex;
      flex-direction: column;
    }

    .move-btn {
      font-family: 'Finger Paint', Arial, sans-serif;
      font-size: 10px;
      width: 24px;
      height: 16px;
      padding: 0;
      cursor: pointer;
      border: 2px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-sizing: border-box;
      position: relative;
      margin-top: -2px;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .move-btn:first-child {
      margin-top: 0;
    }

    .move-btn:not(:disabled) {
      z-index: 2;
    }

    .move-btn:disabled {
      z-index: 1;
      opacity: 0.3;
      cursor: default;
    }

    .move-btn span {
      display: inline-block;
      transform: rotate(90deg);
    }

    .move-btn:active:not(:disabled) {
      background: var(--btn-active);
    }

    .color-preview-box {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border-color);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.3s;
    }

    .color-preview-box input[type="color"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .layer-label {
      flex-grow: 1;
      font-size: 1rem;
      user-select: none;
      color: var(--text-color);
    }

    .layer-actions {
      display: flex;
      gap: 5px;
    }

    .small-btn, .add-layer-btn {
      font-family: 'Finger Paint', Arial, sans-serif;
      cursor: pointer;
      border: 2px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--text-color);
      transition: background 0.3s, border-color 0.3s;
      filter: drop-shadow(0 3px 2px var(--shadow-color));
    }

    .small-btn {
      font-size: 0.9rem;
      padding: 4px 8px;
    }

    .small-btn:active {
      background: var(--btn-active);
    }

    .add-layer-btn {
      width: 100%;
      font-size: 1rem;
      padding: 8px;
      flex-shrink: 0;
    }

    .stage-wrapper {
      display: flex;
      justify-content: center;
      max-height: 35vh;
      overflow: hidden;
      filter: drop-shadow(0 6px 5px var(--shadow-color));
    }

    .stage {
      position: relative;
      display: inline-block;
      transform-origin: top center;
      padding: 2px; 
      background-color: var(--border-color);
      line-height: 0;
      transition: background-color 0.3s;
    }

    .ui-layer {
      position: relative;
      display: block;
      z-index: 2;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: none; 
    }

    .gradient-canvas {
      position: absolute;
      z-index: 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #rect1 {
      left: 21px; 
      top: 40px;
      width: 301px;
      height: 21px;
    }

    #rect2 {
      left: 174px;
      top: 67px;
      width: 148px;
      height: 6px;
    }

    /* Bottom input box area */
    .input-group {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      filter: drop-shadow(0 6px 5px var(--shadow-color));
    }

    input[type="text"] {
      font-family: 'Finger Paint', Arial, sans-serif;
      font-size: 1.1rem;
      padding: 1.2vh 1.2vw;
      flex-grow: 1;
      border: 3px solid var(--border-color);
      border-radius: 0;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--input-bg);
      color: var(--text-color);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .btn {
      font-family: 'Finger Paint', Arial, sans-serif;
      font-size: 1.1rem;
      padding: 1.2vh 1.8vw;
      cursor: pointer;
      border: 3px solid var(--border-color);
      border-left: none;
      border-radius: 0;
      background: var(--btn-bg);
      color: var(--text-color);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .btn:active {
      background: var(--btn-active);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-controls">
      <button class="pixel-btn" onclick="toggleDarkMode()">Theme</button>
      <button class="pixel-btn" id="overlayToggleBtn" onclick="toggleOverlay()">Overlay: 1</button>
    </div>
    
    <p class="watermark">Vibecoded with the use of AI</p>
    <h1>JJS Gradient Maker</h1>
    
    <div class="layers-container" id="layersContainer">
      <div id="layersList"></div>
      <button class="add-layer-btn" onclick="addLayer()">Add Color</button>
    </div>

    <div class="stage-wrapper" id="stageWrapper">
      <div class="stage" id="stage">
        <canvas class="gradient-canvas" id="rect1" width="301" height="21"></canvas>
        <canvas class="gradient-canvas" id="rect2" width="148" height="6"></canvas>
        <img src="overlay.png" class="ui-layer" id="overlayImg" alt="UI Overlay">
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="colorInput" value="2,172,255 83,253,255" placeholder="Type colors here...">
      <button class="btn" onclick="copyCleaned()">Copy</button>
    </div>
  </div>

  <script>
    const overlayImg = document.getElementById('overlayImg');
    const colorInput = document.getElementById('colorInput');
    const layersList = document.getElementById('layersList');
    const overlayToggleBtn = document.getElementById('overlayToggleBtn');

    let currentOverlayIndex = 1;

    let layers = [
      { r: 2, g: 172, b: 255 },
      { r: 83, g: 253, b: 255 }
    ];

    // Initialize theme from localStorage, falling back to system preference
    const savedTheme = localStorage.getItem('jjs_theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
    } else if (savedTheme === 'light') {
      document.body.classList.remove('dark-mode');
    } else {
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      if (systemPrefersDark.matches) {
        document.body.classList.add('dark-mode');
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('jjs_theme', isDark ? 'dark' : 'light');
    }

    function toggleOverlay() {
      if (currentOverlayIndex === 1) {
        currentOverlayIndex = 2;
        overlayImg.src = 'overlay2.png';
        overlayToggleBtn.textContent = 'Overlay: 2';
      } else {
        currentOverlayIndex = 1;
        overlayImg.src = 'overlay.png';
        overlayToggleBtn.textContent = 'Overlay: 1';
      }
    }

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function hexToRgbObj(hex) {
      let cleanHex = hex.startsWith('#') ? hex.slice(1) : hex;
      if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(c => c + c).join('');
      }
      let bigint = parseInt(cleanHex, 16);
      return {
        r: (bigint >> 16) & 255,
        g: (bigint >> 8) & 255,
        b: bigint & 255
      };
    }

    function hexToRgbString(hex) {
      const rgb = hexToRgbObj(hex);
      return `${rgb.r},${rgb.g},${rgb.b}`;
    }

    function hexToRgb(hex) {
      let bigint = parseInt(hex.slice(1), 16);
      return {
        r: (bigint >> 16) & 255,
        g: (bigint >> 8) & 255,
        b: bigint & 255
      };
    }

    function updateInputFromLayers() {
      colorInput.value = layers.map(l => `${l.r},${l.g},${l.b}`).join(' ');
      render();
    }

    function parseTokenToRgb(t) {
      let cleaned = t.trim();
      if (cleaned.endsWith(',')) cleaned = cleaned.slice(0, -1);
      
      // Check if it's a hex code (with or without #)
      if (cleaned.startsWith('#') || /^[0-9A-Fa-f]{3}$|^[0-9A-Fa-f]{6}$/.test(cleaned)) {
        try {
          return hexToRgbObj(cleaned);
        } catch (e) {
          return null;
        }
      }

      const commas = (cleaned.match(/,/g) || []).length;
      if (commas === 0 && cleaned !== '') cleaned += ',0,0';
      else if (commas === 1) cleaned += ',0';
      
      const parts = cleaned.split(',').map(Number);
      if (parts.length >= 3) {
        return { r: parts[0] || 0, g: parts[1] || 0, b: parts[2] || 0 };
      }
      return null;
    }

    function updateLayersFromInput() {
      const val = colorInput.value.trim();
      if (!val) return;
      const tokens = val.split(/\s+/);
      let newLayers = [];
      for (let t of tokens) {
        const rgb = parseTokenToRgb(t);
        if (rgb) {
          newLayers.push(rgb);
        }
      }
      if (newLayers.length > 0) {
        layers = newLayers;
        renderLayersUI();
      }
      render();
    }

    colorInput.addEventListener('input', updateLayersFromInput);

    function renderLayersUI() {
      layersList.innerHTML = '';
      
      for (let index = layers.length - 1; index >= 0; index--) {
        const layer = layers[index];
        const hex = rgbToHex(layer.r, layer.g, layer.b);
        
        const row = document.createElement('div');
        row.className = 'layer-row';

        const moveContainer = document.createElement('div');
        moveContainer.className = 'move-buttons';

        const upBtn = document.createElement('button');
        upBtn.className = 'move-btn';
        upBtn.innerHTML = '<span>&lt;</span>';
        upBtn.disabled = (index === layers.length - 1);
        upBtn.onclick = () => {
          if (index < layers.length - 1) {
            const temp = layers[index];
            layers[index] = layers[index + 1];
            layers[index + 1] = temp;
            renderLayersUI();
            updateInputFromLayers();
          }
        };

        const downBtn = document.createElement('button');
        downBtn.className = 'move-btn';
        downBtn.innerHTML = '<span>&gt;</span>';
        downBtn.disabled = (index === 0);
        downBtn.onclick = () => {
          if (index > 0) {
            const temp = layers[index];
            layers[index] = layers[index - 1];
            layers[index - 1] = temp;
            renderLayersUI();
            updateInputFromLayers();
          }
        };

        moveContainer.appendChild(upBtn);
        moveContainer.appendChild(downBtn);

        const colorBox = document.createElement('div');
        colorBox.className = 'color-preview-box';
        colorBox.style.backgroundColor = hex;
        
        const colorPickerInput = document.createElement('input');
        colorPickerInput.type = 'color';
        colorPickerInput.value = hex;
        colorPickerInput.addEventListener('input', (e) => {
          const rgb = hexToRgb(e.target.value);
          layers[index] = rgb;
          colorBox.style.backgroundColor = e.target.value;
          updateInputFromLayers();
        });
        colorBox.appendChild(colorPickerInput);

        const label = document.createElement('div');
        label.className = 'layer-label';
        label.textContent = `Color ${index + 1}: RGB(${layer.r}, ${layer.g}, ${layer.b})`;

        const actions = document.createElement('div');
        actions.className = 'layer-actions';
        
        if (layers.length > 1) {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'small-btn';
          deleteBtn.textContent = 'X';
          deleteBtn.onclick = () => {
            layers.splice(index, 1);
            renderLayersUI();
            updateInputFromLayers();
          };
          actions.appendChild(deleteBtn);
        }

        row.appendChild(moveContainer);
        row.appendChild(colorBox);
        row.appendChild(label);
        row.appendChild(actions);
        layersList.appendChild(row);
      }
    }

    function addLayer() {
      const last = layers[layers.length - 1] || { r: 255, g: 255, b: 255 };
      layers.push({ ...last });
      renderLayersUI();
      updateInputFromLayers();
      layersList.scrollTop = 0;
    }

    function cleanColorToken(c) {
      c = c.trim();
      if (c.endsWith(',')) c = c.slice(0, -1).trim();
      
      // If it's a hex code, convert it to RGB format string
      if (c.startsWith('#') || /^[0-9A-Fa-f]{3}$|^[0-9A-Fa-f]{6}$/.test(c)) {
        try {
          return hexToRgbString(c);
        } catch (e) {
          return c;
        }
      }

      if (c.startsWith('rgb') || c.startsWith('RGB')) return c;
      const commas = (c.match(/,/g) || []).length;
      if (commas === 0 && c !== '') c = c + ',0,0';
      else if (commas === 1) c = c + ',0';
      return c;
    }

    function parseColor(c) {
      const rgb = parseTokenToRgb(c);
      if (rgb) {
        return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      }
      return c;
    }

    function drawGradient(canvasId, parts) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
      parts.forEach((color, index) => {
        const stop = parts.length === 1 ? 0 : index / (parts.length - 1);
        gradient.addColorStop(stop, color);
      });

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function render() {
      const val = colorInput.value.trim();
      if (!val) return;
      const parts = val.split(/\s+/).map(parseColor);
      drawGradient('rect1', parts);
      drawGradient('rect2', parts);
    }

    function copyCleaned() {
      const val = colorInput.value.trim();
      if (!val) return;
      const cleanedTokens = val.split(/\s+/).map(cleanColorToken);
      const cleanedString = cleanedTokens.join(' ');

      navigator.clipboard.writeText(cleanedString).then(() => {
        colorInput.value = cleanedString;
        updateLayersFromInput();
      });
    }

    function updateStageScale() {
      if (!overlayImg.naturalWidth) return;
      const stage = document.getElementById('stage');
      const wrapper = document.getElementById('stageWrapper');
      
      stage.style.width = overlayImg.naturalWidth + 'px';
      stage.style.height = overlayImg.naturalHeight + 'px';
      
      const targetHeight = window.innerHeight * 0.28;
      const scale = Math.max(2, Math.min(5, targetHeight / overlayImg.naturalHeight));
      
      stage.style.transform = `scale(${scale})`;
      wrapper.style.width = ((overlayImg.naturalWidth + 4) * scale) + 'px';
      wrapper.style.height = ((overlayImg.naturalHeight + 4) * scale) + 'px';
    }

    window.addEventListener('resize', updateStageScale);

    overlayImg.onload = function() {
      updateStageScale();
      updateLayersFromInput();
    };

    if (overlayImg.complete) {
      overlayImg.onload();
    } else {
      renderLayersUI();
      render();
    }
  </script>

</body>
</html>
